name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: TypeCheck + Prisma validate ──────────────────────────────────────
  check:
    name: Typecheck & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @taxi/db generate

      - name: TypeScript typecheck (all packages)
        run: pnpm typecheck

      - name: Prisma schema validate
        run: pnpm --filter @taxi/db exec prisma validate

  # ─── Job 2: Docker build (API) ────────────────────────────────────────────────
  docker-api:
    name: Docker — API
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          tags: taxi-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ─── Job 3: Docker build (Bot) ───────────────────────────────────────────────
  docker-bot:
    name: Docker — Bot
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bot
          push: false
          tags: taxi-bot:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

  # ─── Job 4: Push to GHCR (only on main/master merge) ────────────────────────
  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [docker-api, docker-bot]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Push Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bot
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bot:latest
            ghcr.io/${{ github.repository }}/bot:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
